# Veracode mitigations.
#
#   Issue labelled `approved`        records the mitigation request in mitigations.yml, refreshes the
#                                    dashboard, comments and closes the issue. Only logins listed in the
#                                    repository variable MITIGATION_APPROVERS can approve.
#   Pull request on mitigations.yml  validates the file and comments a table of the rules added, changed or
#                                    removed, using the checker from the base branch.
#
# The issue text never reaches a shell: the script reads it from a JSON file. See docs/MITIGATIONS.md.

name: Veracode mitigations

on:
  issues:
    types: [labeled]
  pull_request:
    paths:
      - mitigations.yml

permissions: {}

jobs:
  approve:
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'mitigation-request')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit mitigations.yml, tracking/ and FINDINGS.md
      issues: write     # comment, remove the label, close
    concurrency:
      group: veracode-tracking   # shared with the daily tracker
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      APPROVER: ${{ github.event.sender.login }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Record the mitigation
        id: record
        env:
          MITIGATION_APPROVERS: ${{ vars.MITIGATION_APPROVERS }}
        run: |
          # The issue as it was when the label was added, from the event payload, into a file.
          jq '.issue | {number, title, body, url: .html_url, state, author: {login: .user.login}}' \
            "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/issue.json"
          jq -r '.body // ""' "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/then.txt"
          gh issue view "$ISSUE" --repo "$REPO" --json body > "$RUNNER_TEMP/now.json"
          jq -r '.body // ""' "$RUNNER_TEMP/now.json" > "$RUNNER_TEMP/now.txt"
          if ! cmp -s "$RUNNER_TEMP/then.txt" "$RUNNER_TEMP/now.txt"; then
            echo "- the issue was edited after the label was added. Review it and add the label again." \
              > "$RUNNER_TEMP/error.txt"
            echo "rc=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python veracode_iac_extract.py --approve-issue "$RUNNER_TEMP/issue.json" --mitigations mitigations.yml \
            --approver "$APPROVER" --track tracking 2> "$RUNNER_TEMP/error.txt"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Not an approver
        if: steps.record.outputs.rc == '3'
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label approved
          gh issue comment "$ISSUE" --repo "$REPO" --body "@$APPROVER is not an approver. Approvers are listed in the repository variable MITIGATION_APPROVERS."

      - name: Invalid request
        if: steps.record.outputs.rc == '2'
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label approved
          {
            echo "This mitigation was not recorded:"
            echo
            head -c 60000 "$RUNNER_TEMP/error.txt"
            echo
            echo "Edit the issue, then add the \`approved\` label again."
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"

      - name: Unexpected error
        if: steps.record.outputs.rc != '0' && steps.record.outputs.rc != '2' && steps.record.outputs.rc != '3'
        run: |
          cat "$RUNNER_TEMP/error.txt"
          exit 1

      - name: Refresh the dashboard and commit
        if: steps.record.outputs.rc == '0'
        env:
          ID: ${{ steps.record.outputs.id }}
        run: |
          python veracode_iac_extract.py --track tracking --offline --mitigations mitigations.yml
          git add -A -- mitigations.yml tracking FINDINGS.md
          if git diff --cached --quiet; then echo "Already recorded."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Approve mitigation $ID (#$ISSUE)"
          for i in 1 2 3; do
            if git push -q origin "HEAD:$BRANCH"; then exit 0; fi
            git pull -q --rebase origin "$BRANCH" || { git rebase --abort || true; break; }
          done
          echo "Could not push to $BRANCH." >&2
          exit 1

      - name: Comment and close the issue
        if: steps.record.outputs.rc == '0'
        env:
          ID: ${{ steps.record.outputs.id }}
          MATCHES: ${{ steps.record.outputs.matches }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "Approved as $ID, applied to $MATCHES finding(s)."
          gh issue close "$ISSUE" --repo "$REPO" --reason completed

  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # to comment the table of changes
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests "PyYAML>=6.0"   # not the pull request's requirements.txt

      - name: Compare with the base branch
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="origin/$BASE_REF"
          # The checker comes from the base branch, so a pull request cannot change how it is checked.
          git show "$base:veracode_iac_extract.py" > "$RUNNER_TEMP/check.py" 2>/dev/null \
            || cp veracode_iac_extract.py "$RUNNER_TEMP/check.py"
          git show "$base:mitigations.yml" > "$RUNNER_TEMP/base.yml" 2>/dev/null || : > "$RUNNER_TEMP/base.yml"
          mkdir -p "$RUNNER_TEMP/base-tracking"
          git show "$base:tracking/findings.csv" > "$RUNNER_TEMP/base-tracking/findings.csv" 2>/dev/null \
            || rm -f "$RUNNER_TEMP/base-tracking/findings.csv"
          set +e
          python "$RUNNER_TEMP/check.py" --check-mitigations mitigations.yml --against "$RUNNER_TEMP/base.yml" \
            --track "$RUNNER_TEMP/base-tracking" > "$RUNNER_TEMP/report.md"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        continue-on-error: true   # pull requests from forks get a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- veracode-mitigations -->'
          { echo "$marker"; cat "$RUNNER_TEMP/report.md"; } > "$RUNNER_TEMP/comment.md"
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
               | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          fi

      - name: Fail if the mitigations are invalid
        if: steps.check.outputs.rc != '0'
        run: exit 1
