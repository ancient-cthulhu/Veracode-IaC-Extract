# Veracode findings tracker: every day, update the findings baseline from Veracode and commit it.
#
#   tracking/findings.csv   open findings (New, Open, Reopened, Asset Missing) with their mitigation status
#   tracking/fixed.csv      findings that were fixed, with the date and days open
#   FINDINGS.md             dashboard, with a Mitigate link per finding
#
# Setup: repository secrets VERACODE_API_KEY_ID and VERACODE_API_KEY_SECRET. Optional repository variable
# VERACODE_TRACK_ARGS with scan filters, e.g. --asset my-org/*. See README.md.

name: Veracode findings tracker

on:
  schedule:
    - cron: "23 5 * * *"   # every day at 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write   # commit tracking/, FINDINGS.md and mitigations.yml
  issues: write     # create the labels and the tracker-failure issue

concurrency:
  group: veracode-tracking   # shared with the approval workflow: one writer at a time
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6   # bot-only job, no pull request code: the token is needed to push
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Create the labels used by the mitigation flow
        run: |
          gh label create mitigation-request --repo "$REPO" --color 0E8A16 \
            --description "Request to mitigate a Veracode finding" 2>/dev/null || true
          gh label create approved --repo "$REPO" --color 1D76DB \
            --description "Mitigation approved (approvers only)" 2>/dev/null || true
          gh label create tracker-failure --repo "$REPO" --color B60205 \
            --description "The daily Veracode tracking failed" 2>/dev/null || true

      - name: Update the findings baseline
        id: track
        env:
          VERACODE_API_KEY_ID: ${{ secrets.VERACODE_API_KEY_ID }}
          VERACODE_API_KEY_SECRET: ${{ secrets.VERACODE_API_KEY_SECRET }}
          VERACODE_TRACK_ARGS: ${{ vars.VERACODE_TRACK_ARGS }}
        run: |
          set -f
          read -ra args <<< "${VERACODE_TRACK_ARGS:-}"
          python veracode_iac_extract.py --track tracking --mitigations mitigations.yml \
            -o "$RUNNER_TEMP/veracode-findings.xlsx" "${args[@]}"

      - name: Commit the changes
        env:
          NEW: ${{ steps.track.outputs.new }}
          FIXED: ${{ steps.track.outputs.fixed }}
        run: |
          git add -A -- tracking FINDINGS.md mitigations.yml
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Daily findings: +${NEW:-0} new, -${FIXED:-0} fixed"
          for i in 1 2 3; do
            if git push -q origin "HEAD:$BRANCH"; then exit 0; fi
            git pull -q --rebase origin "$BRANCH" || { git rebase --abort || true; break; }
          done
          git push -q --force origin HEAD:refs/heads/tracking
          echo "Could not push to $BRANCH (branch protection?). The update is on branch \`tracking\`." \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: veracode-findings
          path: ${{ runner.temp }}/veracode-findings.xlsx
          if-no-files-found: ignore
          retention-days: 30

      - name: Open or update the failure issue
        if: failure()
        run: |
          n=$(gh issue list --repo "$REPO" --label tracker-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$REPO" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$REPO" --title "Daily Veracode tracking failed" --label tracker-failure \
              --body "The daily run failed: $RUN_URL. Nothing was changed. This issue is closed after the next successful run."
          fi

      - name: Close the failure issue
        if: success()
        run: |
          for n in $(gh issue list --repo "$REPO" --label tracker-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$REPO" --comment "Tracking works again: $RUN_URL"
          done
